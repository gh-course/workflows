name: reusable workflow
on:
    workflow_call:
        inputs:
            name:
                required: true
                type: string
                default: "Mohamed"
jobs:
    say-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Display github context
              run: echo "${{ toJson(github) }}"
            - name: Say Hello
              run: echo "Hello ${{ inputs.name }}!"
